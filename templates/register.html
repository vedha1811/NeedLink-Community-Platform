<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedLink – Register</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232636;--border:#2e3248;--accent:#4f8ef7;--accent2:#7c5cbf;--danger:#e05c5c;--success:#4caf7d;--warn:#f0a500;--text:#e8eaf0;--muted:#7c8097;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:420px}
.logo{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--accent);text-align:center;display:block;margin-bottom:8px;text-decoration:none}
h2{font-family:'DM Serif Display',serif;font-size:1.5rem;text-align:center;margin-bottom:28px;color:var(--text)}
.alert{background:rgba(224,92,92,0.12);border:1px solid rgba(224,92,92,0.3);color:var(--danger);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:0.9rem}
.form-group{margin-bottom:16px}
input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s}
input::placeholder{color:var(--muted)}
input:focus{border-color:var(--accent)}
button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:13px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity 0.2s}
button:hover{opacity:0.88}
p{text-align:center;margin-top:20px;color:var(--muted);font-size:0.9rem}
p a{color:var(--accent);text-decoration:none;font-weight:500}
p a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <a href="/dashboard" class="logo">NeedLink</a>
  <h2>Create Account</h2>
  {% if error %}
  <div class="alert">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="form-group"><input name="name" placeholder="Full Name"></div>
    <div class="form-group"><input name="email" placeholder="Email"></div>
    <div class="form-group"><input type="password" name="password" placeholder="Password"></div>
    <div class="form-group"><input name="phone" placeholder="Phone"></div>
    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="/login">Login</a></p>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedLink – My Volunteers</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232636;--border:#2e3248;--accent:#4f8ef7;--text:#e8eaf0;--muted:#7c8097;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:100}
.nav-inner{max-width:960px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--accent);text-decoration:none}
.container{max-width:700px;margin:0 auto;padding:0 20px}
.page-header{padding:40px 0 28px}
.page-header h1{font-family:'DM Serif Display',serif;font-size:2rem;margin-bottom:6px}
.page-header p{color:var(--muted)}
.vol-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:12px;display:flex;align-items:center;gap:16px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.vol-info strong{display:block;font-weight:600;font-size:0.97rem}
.vol-info span{color:var(--muted);font-size:0.85rem}
.empty{text-align:center;color:var(--muted);padding:48px 0;font-size:0.95rem}
.btn-back{display:inline-block;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:10px 20px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;text-decoration:none;margin-top:8px;transition:all 0.2s;margin-bottom:40px}
.btn-back:hover{border-color:var(--accent);color:var(--text)}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/dashboard" class="logo">NeedLink</a>
  </div>
</nav>
<div class="container">
  <div class="page-header">
    <h1>My Volunteers</h1>
    <p>People who have helped with your requests.</p>
  </div>
  {% for v in volunteers %}
  <div class="vol-card">
    <div class="avatar">👤</div>
    <div class="vol-info">
      <strong>{{ v.name }}</strong>
      <span>{{ v.email }}</span>
    </div>
  </div>
  {% else %}
  <div class="empty">No volunteers yet.</div>
  {% endfor %}
  <a href="/dashboard" class="btn-back">← Back to Dashboard</a>
</div>
</body>
</html>

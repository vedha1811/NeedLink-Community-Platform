<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedLink – Emergency SOS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232636;--border:#2e3248;--accent:#4f8ef7;--danger:#e05c5c;--success:#4caf7d;--sos:#ff3b3b;--text:#e8eaf0;--muted:#7c8097;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:500px;text-align:center}
.logo{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--accent);display:block;margin-bottom:16px;text-decoration:none}
h3{font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--sos);margin-bottom:8px}
.sub{color:var(--muted);font-size:0.9rem;margin-bottom:32px}
.sub strong{color:var(--text)}
.sos-btn{width:180px;height:180px;border-radius:50%;background:var(--sos);color:#fff;border:5px solid rgba(255,59,59,0.4);font-family:'DM Serif Display',serif;font-size:1.3rem;font-weight:700;cursor:pointer;animation:pulse 1.5s infinite;transition:transform 0.2s}
.sos-btn:hover{transform:scale(1.04)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,59,.5)}70%{box-shadow:0 0 0 28px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
.sos-center{display:flex;justify-content:center;margin-bottom:32px}
.sos-form{display:none;text-align:left;margin-top:24px}
#map{height:220px;border-radius:10px;margin-bottom:16px;border:1px solid var(--border)}
.sos-form input[type="text"]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;margin-bottom:14px;transition:border-color 0.2s}
.sos-form input[type="text"]:focus{border-color:var(--sos)}
.btn-sos-send{width:100%;background:var(--sos);color:#fff;border:none;border-radius:8px;padding:13px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;transition:opacity 0.2s}
.btn-sos-send:hover{opacity:0.88}
.alert-success{background:rgba(76,175,125,0.12);border:1px solid rgba(76,175,125,0.3);color:var(--success);border-radius:10px;padding:20px;margin-bottom:20px}
.alert-success h5{font-family:'DM Serif Display',serif;font-size:1.2rem;margin-bottom:6px}
.alert-success p{font-size:0.9rem;margin-bottom:14px;color:var(--muted)}
.btn-group{display:flex;gap:10px;justify-content:center}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;transition:opacity 0.2s}
.btn-primary:hover{opacity:0.88}
.btn-back{display:block;width:100%;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:11px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;text-decoration:none;margin-top:16px;transition:all 0.2s}
.btn-back:hover{border-color:var(--accent);color:var(--text)}
.btn-outline{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:10px 20px;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;transition:all 0.2s}
.btn-outline:hover{border-color:var(--accent);color:var(--text)}
</style>
</head>
<body>
<div class="card">
  <a href="/dashboard" class="logo">NeedLink</a>
  <h3>🆘 Emergency SOS</h3>
  <p class="sub">Press SOS to instantly alert <strong>all users</strong>. Your location will be shared.</p>
  {% if success %}
  <div class="alert-success">
    <h5>✅ SOS Sent!</h5>
    <p>All users notified. Help is on the way.</p>
    <div class="btn-group">
      <a href="/view_needs" class="btn-primary">View Request</a>
      <a href="/dashboard" class="btn-outline">Dashboard</a>
    </div>
  </div>
  {% else %}
  <div class="sos-center">
    <button class="sos-btn" onclick="activateSOS()" id="sosBtn">🆘<br>PRESS SOS</button>
  </div>
  <form method="POST" id="sosForm" class="sos-form">
    <div id="map"></div>
    <input type="hidden" name="lat" id="lat">
    <input type="hidden" name="lng" id="lng">
    <input type="text" name="description" value="🆘 Emergency! I need immediate help." placeholder="Describe your emergency">
    <button type="submit" class="btn-sos-send">Send SOS Alert to All Users</button>
  </form>
  {% endif %}
  <a href="/dashboard" class="btn-back">← Back to Dashboard</a>
</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
function activateSOS() {
    document.getElementById('sosBtn').textContent = '📍 Locating...';
    document.getElementById('sosBtn').disabled = true;
    document.getElementById('sosForm').style.display = 'block';
    const map = L.map('map').setView([12.9716,77.5946],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let marker;
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            const {latitude:lat,longitude:lng} = pos.coords;
            map.setView([lat,lng],15);
            marker = L.marker([lat,lng]).addTo(map).bindPopup('Your Location').openPopup();
            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;
        });
    }
    map.on('click', e => {
        if(marker) marker.setLatLng(e.latlng); else marker = L.marker(e.latlng).addTo(map);
        document.getElementById('lat').value = e.latlng.lat;
        document.getElementById('lng').value = e.latlng.lng;
    });
}
</script>
</body>
</html>

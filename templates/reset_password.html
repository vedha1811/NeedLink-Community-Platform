<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedLink – Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232636;--border:#2e3248;--accent:#4f8ef7;--success:#4caf7d;--text:#e8eaf0;--muted:#7c8097;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:400px;text-align:center}
.logo{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--accent);display:block;margin-bottom:8px;text-decoration:none}
h3{font-family:'DM Serif Display',serif;font-size:1.4rem;margin-bottom:8px}
.sub{color:var(--muted);font-size:0.88rem;margin-bottom:28px}
input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s;margin-bottom:16px}
input::placeholder{color:var(--muted)}
input:focus{border-color:var(--accent)}
button{width:100%;background:var(--success);color:#fff;border:none;border-radius:8px;padding:13px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:opacity 0.2s}
button:hover{opacity:0.88}
</style>
</head>
<body>
<div class="card">
  <a href="/dashboard" class="logo">NeedLink</a>
  <h3>Reset Password</h3>
  <p class="sub">Enter your new password below.</p>
  <form method="POST">
    <input type="password" name="password" placeholder="New Password" required>
    <button type="submit">Update Password</button>
  </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedLink – Chat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232636;--border:#2e3248;--accent:#4f8ef7;--success:#4caf7d;--warn:#f0a500;--info:#38bdf8;--danger:#e05c5c;--text:#e8eaf0;--muted:#7c8097;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:100}
.nav-inner{max-width:960px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--accent);text-decoration:none}
.nav-links a{color:var(--muted);text-decoration:none;font-size:0.88rem;font-weight:500;padding:6px 11px;border-radius:8px;transition:all 0.2s}
.nav-links a:hover{background:var(--surface2);color:var(--text)}
.container{max-width:760px;margin:0 auto;padding:0 20px}
.page-header{padding:32px 0 20px;display:flex;justify-content:space-between;align-items:center}
.page-header h1{font-family:'DM Serif Display',serif;font-size:1.8rem}
.badge{display:inline-block;font-size:0.75rem;font-weight:600;padding:4px 10px;border-radius:999px}
.badge-info{background:rgba(56,189,248,0.15);color:var(--info);border:1px solid rgba(56,189,248,0.3)}
.badge-success{background:rgba(76,175,125,0.15);color:var(--success);border:1px solid rgba(76,175,125,0.3)}
.badge-warn{background:rgba(240,165,0,0.15);color:var(--warn);border:1px solid rgba(240,165,0,0.3)}
.chat-wrapper{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.chat-box{height:420px;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.chat-box::-webkit-scrollbar{width:4px}
.chat-box::-webkit-scrollbar-track{background:transparent}
.chat-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.msg-row{display:flex}
.msg-row.sent{justify-content:flex-end}
.msg-row.received{justify-content:flex-start}
.bubble{max-width:70%;padding:10px 14px;border-radius:12px}
.bubble .sender{font-size:0.75rem;font-weight:600;margin-bottom:4px;opacity:0.7}
.bubble .text{font-size:0.9rem;line-height:1.5}
.sent .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.received .bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-input-bar{border-top:1px solid var(--border);padding:14px 16px;display:flex;gap:10px}
.chat-input-bar input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s}
.chat-input-bar input:focus{border-color:var(--accent)}
.chat-input-bar input::placeholder{color:var(--muted)}
.chat-input-bar button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.chat-input-bar button:hover{opacity:0.85}
.alert-closed{background:rgba(240,165,0,0.1);border:1px solid rgba(240,165,0,0.3);color:var(--warn);border-radius:8px;padding:12px 16px;text-align:center;font-size:0.9rem;margin-bottom:16px}
.btn-back{display:inline-block;background:var(--surface);border:1px solid var(--border);color:var(--muted);text-decoration:none;padding:9px 18px;border-radius:8px;font-size:0.88rem;font-weight:500;transition:all 0.2s}
.btn-back:hover{border-color:var(--accent);color:var(--text)}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/dashboard" class="logo">NeedLink</a>
    <div class="nav-links">
      <a href="/view_needs">Needs</a>
      <a href="/logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>💬 Chat</h1>
    <span class="badge
      {% if need.status == 'In Progress' %}badge-info
      {% elif need.status == 'Completed' %}badge-success
      {% else %}badge-warn
      {% endif %}">
      {{ need.status }}
    </span>
  </div>

  <div class="chat-wrapper">
    <div class="chat-box" id="chatBox">
      {% for msg in messages %}
      <div class="msg-row {% if msg.sender == session['user'] %}sent{% else %}received{% endif %}">
        <div class="bubble">
          <div class="sender">{{ msg.sender }}</div>
          <div class="text">{{ msg.text }}</div>
        </div>
      </div>
      {% endfor %}
    </div>

    {% if need.status == "In Progress" %}
    <form method="POST" action="/send_message/{{need_id}}" class="chat-input-bar">
      <input type="text" name="message" placeholder="Type a message…" required>
      <button type="submit">Send</button>
    </form>
    {% endif %}
  </div>

  {% if need.status != "In Progress" %}
  <div class="alert-closed">
    Chat is closed — this request has been completed.
  </div>
  {% endif %}

  <a href="/view_needs" class="btn-back">← Back to Needs</a>
</div>

<audio id="notifSound">
  <source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg" type="audio/ogg">
</audio>

<script>
  // Scroll to bottom
  const box = document.getElementById('chatBox');
  if (box) box.scrollTop = box.scrollHeight;

  // Auto refresh every 5 seconds
  setInterval(() => window.location.reload(), 5000);
</script>
</body>
</html>

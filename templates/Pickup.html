<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Pickup – NeedLink</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232636;--border:#2e3248;--accent:#4f8ef7;--success:#4caf7d;--text:#e8eaf0;--muted:#7c8097;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px 36px;width:100%;max-width:520px}
.card-title{font-family:'DM Serif Display',serif;font-size:1.8rem;margin-bottom:6px}
.card-sub{color:var(--muted);font-size:0.9rem;margin-bottom:28px;line-height:1.5}
label{display:block;font-size:0.85rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em}
input[type="text"],textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s;margin-bottom:20px;resize:none}
input[type="text"]:focus,textarea:focus{border-color:var(--accent)}
input[type="text"]::placeholder,textarea::placeholder{color:var(--muted)}
.btn{display:block;width:100%;padding:12px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:all 0.2s;margin-bottom:10px}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-success:hover{opacity:0.88}
.btn-outline{background:transparent;color:var(--muted);border-color:var(--border)}
.btn-outline:hover{background:var(--surface2);color:var(--text)}
</style>
</head>
<body>
<div class="card">
  <h1 class="card-title">📦 Request Pickup &amp; Drop</h1>
  <p class="card-sub">Need medicine, documents, or food delivered? A community member will help.</p>
  <form method="POST">
    <div>
      <label>Item to Deliver</label>
      <input type="text" name="item" placeholder="e.g. Medicine, Documents" required>
    </div>
    <div>
      <label>Pickup Location</label>
      <input type="text" name="pickup_location" placeholder="Where to collect from?" required>
    </div>
    <div>
      <label>Drop Location</label>
      <input type="text" name="drop_location" placeholder="Where to deliver to?" required>
    </div>
    <div>
      <label>Notes (optional)</label>
      <textarea name="notes" rows="3" placeholder="Any special instructions..."></textarea>
    </div>
    <button class="btn btn-success">Submit Request</button>
  </form>
  <a href="/my_pickups" class="btn btn-outline">View My Pickups</a>
  <a href="/dashboard" class="btn btn-outline">← Dashboard</a>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedLink – Edit Profile</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232636;--border:#2e3248;--accent:#4f8ef7;--success:#4caf7d;--text:#e8eaf0;--muted:#7c8097;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:100}
.nav-inner{max-width:960px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--accent);text-decoration:none}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-links a{color:var(--muted);text-decoration:none;font-size:0.88rem;font-weight:500;padding:6px 11px;border-radius:8px;transition:all 0.2s}
.nav-links a:hover{background:var(--surface2);color:var(--text)}
.container{max-width:560px;margin:0 auto;padding:0 20px}
.page-header{padding:40px 0 28px}
.page-header h1{font-family:'DM Serif Display',serif;font-size:2rem;margin-bottom:6px}
.page-header p{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-bottom:24px}
.form-group{margin-bottom:18px}
label{display:block;font-size:0.82rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em}
input,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s}
input:focus,textarea:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
input[type="file"]{padding:9px 14px;cursor:pointer}
input[type="file"]::-webkit-file-upload-button{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-right:10px}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.btn-row{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border:none;border-radius:8px;padding:12px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:opacity 0.2s;text-align:center;text-decoration:none;display:inline-block}
.btn-success{background:var(--success);color:#fff}
.btn-secondary{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.btn:hover{opacity:0.85}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/dashboard" class="logo">NeedLink</a>
    <div class="nav-links">
      <a href="/view_needs">Needs</a>
      <a href="/profile">Profile</a>
      <a href="/logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>Edit Profile</h1>
    <p>Update your personal information and documents.</p>
  </div>

  <div class="card">
    <form method="POST" enctype="multipart/form-data">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" value="{{ user.name }}" placeholder="Your name" required>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ user.phone }}" placeholder="+91 9876543210" required>
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text" name="location" value="{{ user.location if user.location else '' }}" placeholder="City, State">
      </div>

      <hr class="divider">

      <div class="form-group">
        <label>Profile Photo</label>
        <input type="file" name="photo" accept="image/*">
      </div>

      <div class="form-group">
        <label>ID Proof</label>
        <input type="file" name="id_proof" accept="image/*,.pdf">
      </div>

      <div class="btn-row">
        <button type="submit" class="btn btn-success">Update Profile</button>
        <a href="/profile" class="btn btn-secondary">Cancel</a>
      </div>

    </form>
  </div>
</div>
</body>
</html>

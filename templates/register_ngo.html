<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedLink – Register NGO</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232636;--border:#2e3248;--accent:#4f8ef7;--success:#4caf7d;--text:#e8eaf0;--muted:#7c8097;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:460px}
.logo{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--accent);display:block;margin-bottom:8px;text-decoration:none;text-align:center}
h2{font-family:'DM Serif Display',serif;font-size:1.5rem;text-align:center;margin-bottom:28px}
.alert-success{background:rgba(76,175,125,0.12);border:1px solid rgba(76,175,125,0.3);color:var(--success);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:0.9rem}
.form-group{margin-bottom:16px}
label{display:block;font-size:0.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
input,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,textarea:focus{border-color:var(--accent)}
.btn-submit{width:100%;background:var(--success);color:#fff;border:none;border-radius:8px;padding:13px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity 0.2s}
.btn-submit:hover{opacity:0.88}
.btn-back{display:block;width:100%;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none;transition:all 0.2s}
.btn-back:hover{border-color:var(--accent);color:var(--text)}
</style>
</head>
<body>
<div class="card">
  <a href="/dashboard" class="logo">NeedLink</a>
  <h2>Register as NGO</h2>
  {% if success %}
  <div class="alert-success">{{ success }}</div>
  {% endif %}
  <form method="POST">
    <div class="form-group">
      <label>NGO Name</label>
      <input name="ngo_name" placeholder="Enter NGO name" required>
    </div>
    <div class="form-group">
      <label>About NGO</label>
      <textarea name="ngo_desc" placeholder="Describe your organization..." rows="4"></textarea>
    </div>
    <button class="btn-submit" type="submit">Submit Request</button>
  </form>
  <a href="/dashboard" class="btn-back">← Back to Dashboard</a>
</div>
</body>
</html>
